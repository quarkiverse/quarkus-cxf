quarkus.oidc.application-type = service
quarkus.oidc.client-id = quarkus-cxf-oidc
quarkus.oidc.credentials.secret = secret

# Require Keycloak Dev Services for these tests.
quarkus.oidc.devservices.enabled = false
quarkus.keycloak.devservices.users.alice = alice
quarkus.keycloak.devservices.roles.alice = italian
quarkus.keycloak.devservices.users.bob = bob
quarkus.keycloak.devservices.roles.bob = user

quarkus.cxf.endpoint."/hello".implementor = io.quarkiverse.cxf.it.auth.oidc.HelloServiceImpl
