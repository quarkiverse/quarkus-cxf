quarkus.banner.enabled = false

# HTTP/3 does not work with URLConnectionHTTPConduit
quarkus.cxf.http-conduit-factory = VertxHttpClientHTTPConduitFactory

# The HTTP server of this application acts as the HTTP/3 capable peer of the SOAP clients below.
# quarkus-http3 makes it serve HTTP/3 over QUIC on the HTTPS port and advertise that via the Alt-Svc response header.
# It hosts two peers:
# * /peer/echo - Http3Peer, a hand-written SOAP service based on plain Vert.x Web routes
# * /services/echo - ProtocolEchoImpl, a SOAP service exposed by Quarkus CXF
# In addition to those, there is /services/hello - HelloServiceImpl, the example cited in the documentation
# tag::http3.adoc[]
# A named TLS configuration holding the key store of the server
quarkus.tls.localhost.key-store.p12.path = target/classes/localhost-keystore.p12
quarkus.tls.localhost.key-store.p12.password = secret
# Make the HTTP server use it
quarkus.http.tls-configuration-name = localhost

# A SOAP service
quarkus.cxf.endpoint."/hello".implementor = io.quarkiverse.cxf.it.http3.HelloServiceImpl
# end::http3.adoc[]

# Another SOAP service exposed by Quarkus CXF, implementing the same interface as Http3Peer
quarkus.cxf.endpoint."/echo".implementor = io.quarkiverse.cxf.it.http3.ProtocolEchoImpl

# Clients may authenticate using a client certificate, but they do not have to
quarkus.tls.localhost.trust-store.p12.path = target/classes/localhost-server-truststore.p12
quarkus.tls.localhost.trust-store.p12.password = secret
quarkus.http.ssl.client-auth = request

# Trust store for the clients
quarkus.tls.client.trust-store.p12.path = target/classes/localhost-truststore.p12
quarkus.tls.client.trust-store.p12.password = secret

# Include the keystores in the native executable
quarkus.native.resources.includes = *.p12

# Make the metrics available under /q/metrics/json
quarkus.micrometer.export.json.enabled = true
quarkus.micrometer.export.json.path = metrics/json

# HTTP/3 only
quarkus.cxf.client.h3.client-endpoint-url = https://localhost:${quarkus.http.test-ssl-port}/peer/echo
quarkus.cxf.client.h3.service-interface = io.quarkiverse.cxf.it.http3.ProtocolEcho
quarkus.cxf.client.h3.tls-configuration-name = client
quarkus.cxf.client.h3.vertx.http-versions = 3

# Http11Peer: available only over HTTP/1.1, advertises the HTTP server of this application as its HTTP/3 alternative
# via the Alt-Svc response header
http11-peer.port = 8446
http11-peer.http3-port = ${quarkus.http.test-ssl-port}

# HTTP/1.1 first, because Http11Peer does not support HTTP/2; HTTP/3 after the service advertised it via Alt-Svc header.
# The host name has to contain a dot for that
quarkus.cxf.client.h3Fallback.client-endpoint-url = https://127.0.0.1:${http11-peer.port}/peer/echo
quarkus.cxf.client.h3Fallback.service-interface = io.quarkiverse.cxf.it.http3.ProtocolEcho
quarkus.cxf.client.h3Fallback.tls-configuration-name = client
quarkus.cxf.client.h3Fallback.vertx.http-versions = 3,2,1.1

# HTTP/2 first, HTTP/3 after the service advertised it via ALTSVC frame
quarkus.cxf.client.h3FallbackH2.client-endpoint-url = https://127.0.0.1:${quarkus.http.test-ssl-port}/peer/echo
quarkus.cxf.client.h3FallbackH2.service-interface = io.quarkiverse.cxf.it.http3.ProtocolEcho
quarkus.cxf.client.h3FallbackH2.tls-configuration-name = client
quarkus.cxf.client.h3FallbackH2.vertx.http-versions = 3,2,1.1

# The same as h3FallbackH2, but no dot in the host name, hence no HTTP/3
quarkus.cxf.client.h3FallbackLocalhost.client-endpoint-url = https://localhost:${quarkus.http.test-ssl-port}/peer/echo
quarkus.cxf.client.h3FallbackLocalhost.service-interface = io.quarkiverse.cxf.it.http3.ProtocolEcho
quarkus.cxf.client.h3FallbackLocalhost.tls-configuration-name = client
quarkus.cxf.client.h3FallbackLocalhost.vertx.http-versions = 3,2,1.1

# Mutual TLS
quarkus.tls.client-mtls.key-store.p12.path = target/classes/localhost-client-keystore.p12
quarkus.tls.client-mtls.key-store.p12.password = secret
quarkus.tls.client-mtls.trust-store.p12.path = target/classes/localhost-truststore.p12
quarkus.tls.client-mtls.trust-store.p12.password = secret
quarkus.cxf.client.h3MutualTls.client-endpoint-url = https://localhost:${quarkus.http.test-ssl-port}/peer/echo
quarkus.cxf.client.h3MutualTls.service-interface = io.quarkiverse.cxf.it.http3.ProtocolEcho
quarkus.cxf.client.h3MutualTls.tls-configuration-name = client-mtls
quarkus.cxf.client.h3MutualTls.vertx.http-versions = 3

# Trust any server certificate
# With HTTP/3, trust-all works only if hostname verification is disabled too
quarkus.tls.trust-all.trust-all = true
quarkus.tls.trust-all.hostname-verification-algorithm = NONE
quarkus.cxf.client.h3TrustAll.client-endpoint-url = https://localhost:${quarkus.http.test-ssl-port}/peer/echo
quarkus.cxf.client.h3TrustAll.service-interface = io.quarkiverse.cxf.it.http3.ProtocolEcho
quarkus.cxf.client.h3TrustAll.tls-configuration-name = trust-all
quarkus.cxf.client.h3TrustAll.vertx.http-versions = 3

# No trust store
quarkus.cxf.client.h3Untrusted.client-endpoint-url = https://localhost:${quarkus.http.test-ssl-port}/peer/echo
quarkus.cxf.client.h3Untrusted.service-interface = io.quarkiverse.cxf.it.http3.ProtocolEcho
quarkus.cxf.client.h3Untrusted.vertx.http-versions = 3

quarkus.cxf.client.h3Redirect.client-endpoint-url = https://localhost:${quarkus.http.test-ssl-port}/peer/echo
quarkus.cxf.client.h3Redirect.service-interface = io.quarkiverse.cxf.it.http3.ProtocolEcho
quarkus.cxf.client.h3Redirect.tls-configuration-name = client
quarkus.cxf.client.h3Redirect.vertx.http-versions = 3
quarkus.cxf.client.h3Redirect.auto-redirect = true

quarkus.cxf.client.h3EndpointOverride.client-endpoint-url = https://localhost:${quarkus.http.test-ssl-port}/peer/echo
quarkus.cxf.client.h3EndpointOverride.service-interface = io.quarkiverse.cxf.it.http3.ProtocolEcho
quarkus.cxf.client.h3EndpointOverride.tls-configuration-name = client
quarkus.cxf.client.h3EndpointOverride.vertx.http-versions = 3,2,1.1

quarkus.cxf.client.h3ReceiveTimeout.client-endpoint-url = https://localhost:${quarkus.http.test-ssl-port}/peer/echo
quarkus.cxf.client.h3ReceiveTimeout.service-interface = io.quarkiverse.cxf.it.http3.ProtocolEcho
quarkus.cxf.client.h3ReceiveTimeout.tls-configuration-name = client
quarkus.cxf.client.h3ReceiveTimeout.vertx.http-versions = 3
quarkus.cxf.client.h3ReceiveTimeout.receive-timeout = 500

# Nothing listens on UDP port 9
quarkus.cxf.client.h3ConnectionTimeout.client-endpoint-url = https://localhost:9/peer/echo
quarkus.cxf.client.h3ConnectionTimeout.service-interface = io.quarkiverse.cxf.it.http3.ProtocolEcho
quarkus.cxf.client.h3ConnectionTimeout.tls-configuration-name = client
quarkus.cxf.client.h3ConnectionTimeout.vertx.http-versions = 3
quarkus.cxf.client.h3ConnectionTimeout.connection-timeout = 500

# HTTP/3 connections idle for more than 1 second get closed
quarkus.cxf.client.h3KeepAliveTimeout.client-endpoint-url = https://localhost:${quarkus.http.test-ssl-port}/peer/echo
quarkus.cxf.client.h3KeepAliveTimeout.service-interface = io.quarkiverse.cxf.it.http3.ProtocolEcho
quarkus.cxf.client.h3KeepAliveTimeout.tls-configuration-name = client
quarkus.cxf.client.h3KeepAliveTimeout.vertx.http-versions = 3
quarkus.cxf.client.h3KeepAliveTimeout.vertx.http3-keep-alive-timeout = 1

# The keep alive timeouts of other HTTP versions have no effect on HTTP/3 connections
quarkus.cxf.client.h3OtherKeepAliveTimeouts.client-endpoint-url = https://localhost:${quarkus.http.test-ssl-port}/peer/echo
quarkus.cxf.client.h3OtherKeepAliveTimeouts.service-interface = io.quarkiverse.cxf.it.http3.ProtocolEcho
quarkus.cxf.client.h3OtherKeepAliveTimeouts.tls-configuration-name = client
quarkus.cxf.client.h3OtherKeepAliveTimeouts.vertx.http-versions = 3
quarkus.cxf.client.h3OtherKeepAliveTimeouts.vertx.keep-alive-timeout = 1
quarkus.cxf.client.h3OtherKeepAliveTimeouts.vertx.http2-keep-alive-timeout = 1

# At most one HTTP/3 connection; the pool sizes of other HTTP versions have no effect on HTTP/3 connections
quarkus.cxf.client.h3MaxSize1.client-endpoint-url = https://localhost:${quarkus.http.test-ssl-port}/peer/echo
quarkus.cxf.client.h3MaxSize1.service-interface = io.quarkiverse.cxf.it.http3.ProtocolEcho
quarkus.cxf.client.h3MaxSize1.tls-configuration-name = client
quarkus.cxf.client.h3MaxSize1.vertx.http-versions = 3
quarkus.cxf.client.h3MaxSize1.vertx.connection-pool.http3-max-size = 1
quarkus.cxf.client.h3MaxSize1.vertx.connection-pool.http1-max-size = 3
quarkus.cxf.client.h3MaxSize1.vertx.connection-pool.http2-max-size = 3

# At most three HTTP/3 connections
quarkus.cxf.client.h3MaxSize3.client-endpoint-url = https://localhost:${quarkus.http.test-ssl-port}/peer/echo
quarkus.cxf.client.h3MaxSize3.service-interface = io.quarkiverse.cxf.it.http3.ProtocolEcho
quarkus.cxf.client.h3MaxSize3.tls-configuration-name = client
quarkus.cxf.client.h3MaxSize3.vertx.http-versions = 3
quarkus.cxf.client.h3MaxSize3.vertx.connection-pool.http3-max-size = 3
quarkus.cxf.client.h3MaxSize3.vertx.connection-pool.http1-max-size = 1
quarkus.cxf.client.h3MaxSize3.vertx.connection-pool.http2-max-size = 1

# A client whose metrics are checked
quarkus.cxf.client.h3Metrics.client-endpoint-url = https://localhost:${quarkus.http.test-ssl-port}/peer/echo
quarkus.cxf.client.h3Metrics.service-interface = io.quarkiverse.cxf.it.http3.ProtocolEcho
quarkus.cxf.client.h3Metrics.tls-configuration-name = client
quarkus.cxf.client.h3Metrics.vertx.http-versions = 3

# HTTP/3 only client of ProtocolEchoImpl
quarkus.cxf.client.h3Service.client-endpoint-url = https://localhost:${quarkus.http.test-ssl-port}/services/echo
quarkus.cxf.client.h3Service.service-interface = io.quarkiverse.cxf.it.http3.ProtocolEcho
quarkus.cxf.client.h3Service.tls-configuration-name = client
quarkus.cxf.client.h3Service.vertx.http-versions = 3

# Mutual TLS
quarkus.cxf.client.h3ServiceMutualTls.client-endpoint-url = https://localhost:${quarkus.http.test-ssl-port}/services/echo
quarkus.cxf.client.h3ServiceMutualTls.service-interface = io.quarkiverse.cxf.it.http3.ProtocolEcho
quarkus.cxf.client.h3ServiceMutualTls.tls-configuration-name = client-mtls
quarkus.cxf.client.h3ServiceMutualTls.vertx.http-versions = 3

# 3,2,1.1 with ProtocolEchoImpl: HTTP/2 is negotiated for the first request and the client stays on it,
# because quarkus-http3 advertises HTTP/3 only over HTTP/1.x, see https://github.com/quarkiverse/quarkus-cxf/issues/2446
# The host name contains a dot, so that is not what keeps the client from switching to HTTP/3
quarkus.cxf.client.h3ServiceFallback.client-endpoint-url = https://127.0.0.1:${quarkus.http.test-ssl-port}/services/echo
quarkus.cxf.client.h3ServiceFallback.service-interface = io.quarkiverse.cxf.it.http3.ProtocolEcho
quarkus.cxf.client.h3ServiceFallback.tls-configuration-name = client
quarkus.cxf.client.h3ServiceFallback.vertx.http-versions = 3,2,1.1
