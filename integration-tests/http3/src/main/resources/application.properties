# Quarkus 4.0.0.CR1 requires an HTTPS listener even for applications using only HTTP/3 clients.
# The SOAP servers remain independent test resources.
quarkus.http.tls-configuration-name=http3-server
quarkus.http.insecure-requests=enabled
quarkus.vertx.use-async-dns=true
quarkus.cxf.client.direct.vertx.versions=3
quarkus.cxf.client.discovery.vertx.versions=2,1.1,3
quarkus.cxf.client.discovery.vertx.follow-alternative-services=true
quarkus.cxf.client.discoveryHttp1.vertx.versions=1.1,3
quarkus.cxf.client.discoveryHttp1.vertx.follow-alternative-services=true
quarkus.cxf.client.disabled.vertx.versions=2,1.1,3
quarkus.cxf.client.noAdvertisement.vertx.versions=2,1.1,3
quarkus.cxf.client.noAdvertisement.vertx.follow-alternative-services=true
quarkus.cxf.client.tcpOnly.vertx.versions=2,1.1
quarkus.cxf.client.tcpOnly.vertx.follow-alternative-services=true
quarkus.cxf.client.untrusted.vertx.versions=3
quarkus.cxf.client.wrongHost.vertx.versions=3
quarkus.cxf.client.cleartext.vertx.versions=3
quarkus.cxf.client.redirect.vertx.versions=3
quarkus.cxf.client.redirect.auto-redirect=true
quarkus.cxf.client.broken.vertx.versions=2,1.1,3
quarkus.cxf.client.broken.vertx.follow-alternative-services=true
quarkus.cxf.client.mutual.vertx.versions=3
quarkus.cxf.client.missingClientCertificate.vertx.versions=3
